name: Test Safe Site Preflight Action

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Reject a private-network target
        id: private-target
        continue-on-error: true
        uses: ./
        with:
          url: http://127.0.0.1/

      - name: Confirm the target was rejected
        env:
          ACTION_OUTCOME: ${{ steps.private-target.outcome }}
        run: test "$ACTION_OUTCOME" = failure

  released-action:
    runs-on: ubuntu-latest

    steps:
      - name: Reject a private-network target through the published tag
        id: released-private-target
        continue-on-error: true
        uses: BabaVictim/safe-site-preflight@v1
        with:
          url: http://127.0.0.1/

      - name: Confirm the published tag rejected the target
        env:
          ACTION_OUTCOME: ${{ steps.released-private-target.outcome }}
        run: test "$ACTION_OUTCOME" = failure
